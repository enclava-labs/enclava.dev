name: Leads keep-alive + canary

# Supabase free-tier projects pause after ~7 days of inactivity.
# enclava-dev and enclava-ai post leads to the Cloudflare leads-collector now;
# this canary only keeps the shared Supabase project awake for the sites still
# on it (autonomica, freedom-cash) and verifies its anon insert path (RLS
# included). Delete it once those sites move too.
#
# First run inserts canary@enclava.dev; every later run returns a
# 23505 duplicate (unique constraint) — both count as healthy.
# Any other outcome fails the workflow and GitHub emails the actor.
#
# Requires repo secrets (kept only for this canary):
#   VITE_LEADS_SUPABASE_URL
#   VITE_LEADS_SUPABASE_ANON_KEY

on:
  schedule:
    - cron: "23 4 * * *" # daily, off the hour to avoid GH cron congestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "leads-keepalive"
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canary insert into leads
        run: |
          set -euo pipefail
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::VITE_LEADS_SUPABASE_URL / VITE_LEADS_SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          code=$(curl -sS --max-time 30 -o /tmp/body -w "%{http_code}" \
            -X POST "$URL/rest/v1/leads" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"site_id":"enclava-dev","contact_type":"email","contact_value":"canary@enclava.dev","metadata":{"source":"keepalive-canary","site":"enclava-dev"}}')
          echo "status=$code body=$(cat /tmp/body)"
          # 201 = inserted, 23505 = already present → backend healthy
          if [ "$code" = "201" ]; then
            echo "canary inserted"
          elif grep -q 23505 /tmp/body; then
            echo "canary already present (duplicate) — backend healthy"
          else
            echo "::error::Leads backend unhealthy (see status/body above)"
            exit 1
          fi
        env:
          URL: ${{ secrets.VITE_LEADS_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_LEADS_SUPABASE_ANON_KEY }}
